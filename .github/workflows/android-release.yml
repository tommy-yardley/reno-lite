name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Name APK
        id: apk
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_name="$GITHUB_REF_NAME"
          else
            release_name="run-${GITHUB_RUN_NUMBER}"
          fi
          apk_name="reno-lite-${release_name}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          echo "path=$apk_name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: reno-lite-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --generate-notes --verify-tag

